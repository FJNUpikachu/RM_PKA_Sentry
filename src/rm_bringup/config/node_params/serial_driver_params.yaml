/**:
  ros__parameters:

    # ── 机器人类型 ────────────────────────────────────────────────────────────
    # 决定使用哪套串口协议
    #   "sentry"   → 哨兵协议（发 32字节 / 收 32字节）
    #   "infantry" → 步兵协议（发 16字节 / 收 16字节）
    robot_type: "sentry"

    # ── 串口硬件 ──────────────────────────────────────────────────────────────
    port_name: "/dev/ttyACM0"
    baudrate: 115200

    # ── 时间戳补偿 ────────────────────────────────────────────────────────────
    # TF stamp = now() - abs(timestamp_offset)
    timestamp_offset: 0.0

    # 调试开关
    debug: false

    # ── 串口模式 ──────────────────────────────────────────────────────────────
    # 0 → 关闭（不开串口，发布虚拟 receive_data 并广播 TF）
    # 1 → 实际串口（订阅 gimbal_cmd + cmd_vel，缓存后定时发送；接收真实数据）
    # 2 → 虚拟串口（发 yaml 指定的虚拟数据；接收真实数据）
    serial_mode: 1

    # TF 父坐标系
    target_frame: "gimbal_odom"

    # ── mode=1 订阅话题名 ─────────────────────────────────────────────────────
    # 步兵协议不使用 cmd_vel（发送帧无底盘速度字段），设为空字符串可跳过订阅
    gimbal_cmd_topic: "armor_solver/cmd_gimbal"
    cmd_vel_topic: "cmd_vel"          # 步兵时留空 ""
    cmd_vel_linear_scale: 0.2         # 仅哨兵有效

    # ── 频率配置 ──────────────────────────────────────────────────────────────
    send_frequency: 100.0
    read_frequency: 100.0

    # ── mode=0 参数 ───────────────────────────────────────────────────────────
    mock_recv_frequency: 100.0
    mock_mode: 0
    mock_roll: 0.0
    mock_pitch: 0.0
    mock_yaw: 0.0
    mock_chassis_imu_yaw_offset: 0.0  # 步兵时无效，填 0 即可

    # ── mode=2 参数 ───────────────────────────────────────────────────────────
    virtual_send_frequency: 100.0
    virtual_fire_advice: true
    virtual_pitch: 2.56
    virtual_yaw: 55.7
    virtual_distance: 99.67
    # 以下三项仅哨兵协议有效，步兵发送帧无底盘速度字段
    virtual_linear_x: 5.7
    virtual_linear_y: 4.3
    virtual_angular_z: 99.2

    # ── 健康管理（mode=1,2） ──────────────────────────────────────────────────
    max_failure_count: 10
    health_check_interval: 1.0
    max_restart_attempts: 0           # 0 = 不限
    restart_cooldown: 2.0
    enable_auto_restart: true
    restart_delay: 1000               # 毫秒