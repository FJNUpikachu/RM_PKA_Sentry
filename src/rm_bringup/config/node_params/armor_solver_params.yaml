/**:
  ros__parameters:

    # ── 调试开关 ──────────────────────────────────────────────────────────────
    debug: true           # rviz 可视化 marker 总开关
    debug_tracker: false
    debug_ekf: false
    debug_solver: false
    debug_filter: false
    debug_outpost: false

    target_frame: gimbal_odom
    max_armor_distance: 5.5       
    
    # ── 地面兵种 EKF（10-D）────────────────────────────────────────────────────
    # 状态：[xc, vx, yc, vy, zc, vz, yaw, v_yaw, r, d_zc]
    ekf:
      # 过程噪声
      sigma2_q_x:     1.0
      sigma2_q_y:     1.0
      sigma2_q_z:     1.0
      sigma2_q_yaw:   0.6
      sigma2_q_r:     80.0
      sigma2_q_d_zc:  800.0

      # 测量噪声
      r_x:    0.000062
      r_y:    0.000062
      r_z:    0.000062
      r_yaw:  0.00060

      # 状态钳位（防发散）
      state_clamp:
        enable:      true
        radius_min:  0.18
        radius_max:  0.35
        d_zc_min:   -0.35
        d_zc_max:    0.35
        v_yaw_min:  -20.0
        v_yaw_max:   20.0

    # ── 速度限幅（Velocity Clamp，仅地面兵种）──────────────────────────────────
    vel_clamp:
      frames:      50       # 限幅持续帧数
      linear_max:  0.0000001    # 线速度上限 (m/s)
      yaw_max:     0.0000001    # 角速度上限 (rad/s)

    # ── 地面兵种 Tracker ───────────────────────────────────────────────────────
    tracker:
      max_match_distance:  3.5
      max_match_yaw_diff:  0.7
      tracking_thres:      2
      lost_time_thres:     1.3

    # ── Solver（地面兵种）────────────────────────────────────────────────────
    solver:
      prediction_delay:   0.0
      controller_delay:   0.0
      min_switching_v_yaw:  1.2
      max_tracking_v_yaw:   10.0
      bullet_speed:  23.0
      compensator_type: "ideal"
      gravity:     9.82
      resistance:  0.092
      iteration_times: 20

      coming_angle:   77.0
      leaving_angle:  15.0

      fire_margin:         0.8
      # 当目标角速度较大时使用的 fire_margin（> fire_margin_v_yaw_threshold）
      fire_margin_fast:    1.0
      # 用于切换 fire_margin 的角速度阈值（rad/s）
      fire_margin_v_yaw_threshold: 6.5
      min_fire_tolerance:  1.5
      max_fire_tolerance:  4.0

      yaw_offset:    0.3
      # 高角速度时使用的机械偏差（当 |v_yaw| > offset_v_yaw_threshold 时使用）
      yaw_offset_fast:  0.3
      pitch_offset:  1.75
      pitch_offset_fast: 1.65
      # 用于切换偏移量的角速度阈值（rad/s）
      offset_v_yaw_threshold: 7.0

      center_mode:  false
      center_dis:   6.20
      center_yaw:   0.335

      angle_offset: [
        "1.0 2.0 0.0 0.0 0.0 0.0",
        "2.0 3.0 0.0 0.0 0.0 0.0",
        "3.0 4.0 0.0 0.0 0.0 0.0",
        "4.0 5.0 0.0 0.0 0.0 0.0",
        "5.0 6.0 0.0 0.0 0.0 0.0",
        "6.0 8.0 0.0 0.0 0.0 0.0",
      ]

    outpost:
      id: "outpost"
      max_outpost_armor_distance: 1.0  # 前哨站 id=outpost
      plate_pitch_rad: -0.2617993878  # 装甲板 pitch（向下 15°），仅影响 RViz 显示

      tracker:
        max_match_yaw_diff:  1.8

        tracking_thres:      1      
        lost_time_thres:     1.7   

      solver:
        # 弹道补偿
        compensator_type:   "ideal"
        bullet_speed:       23.0
        gravity:            9.82
        resistance:         0.092
        iteration_times:    20

        # 延时
        prediction_delay:   0.0
        controller_delay:   0.0

        # 跟踪 / 火控参数
        max_tracking_v_yaw:   8.0
        min_switching_v_yaw:  0.9

        coming_angle:         75.0
        leaving_angle:        45.0
        
        fire_margin:           0.8
        min_fire_tolerance:    1.5
        max_fire_tolerance:    4.0

        # 机械偏差补偿（与地面兵种独立调节）
        yaw_offset:    3.7
        pitch_offset:  2.7

        # 工作模式（整数）
        #   0 = NORMAL      → yaw+fire 跟随选定装甲板（使用上方参数），pitch 始终跟随原始装甲板
        #   1 = CENTER      → yaw 瞄中心，pitch 跟随原始装甲板，fire 仅查 yaw 误差（< center_yaw）
        #   2 = SINGLE      → 单板 4D [x,y,z,yaw] EKF；无测量时 predict；参数见 single_ekf.*
        mode:         2
        center_yaw:   0.15    # CENTER mode 开火 yaw 误差阈值（rad），不检查距离
        single_fire_max_yaw: 0.40  #0.38
        single_fire_max_pitch: 0.09  #0.07

        # SINGLE 模式专用 4D EKF（过程/测量噪声与初值协方差，对角）
        single_ekf:
          sigma2_q_x:    0.5
          sigma2_q_y:    0.5
          sigma2_q_z:    0.5
          sigma2_q_yaw:  0.05

          r_x:           0.000002
          r_y:           0.000002
          r_z:           0.000002
          r_yaw:         0.000002

          p0_x:          1.0
          p0_y:          1.0
          p0_z:          1.0
          p0_yaw:        0.5

          # 前哨站编队 EKF（8-state）参数：[xc,yc,r,omega,theta1,z1,z2,z3]
        formation_ekf:
          p0_xc: 2.0
          p0_yc: 2.0
          p0_r: 1.0
          p0_omega: 0.2
          p0_theta1: 0.5
          p0_z1: 5.0
          p0_z2: 5.0
          p0_z3: 5.0

          q_xc: 0.0001
          q_yc: 0.0001
          q_r: 0.000001
          q_omega: 0.000001
          q_theta1: 0.0001
          q_z1: 0.0000000001
          q_z2: 0.0000000001
          q_z3: 0.0000000001

          r_x: 0.0064
          r_y: 0.0064
          r_z: 0.0225
          r_yaw: 0.02

        # 前哨站两帧匹配阈值（x,y,z 单位 m，yaw 单位 deg)
        matching_thresh_x: 2.2
        matching_thresh_y: 2.2
        matching_thresh_z: 2.3
        matching_thresh_yaw_deg: 10.0

        # 距离分段手动补偿表
        angle_offset: [
          "1.0 2.0 0.0 0.0 0.0 0.0",
          "2.0 3.0 0.0 0.0 0.0 0.0",
          "3.0 4.0 0.0 0.0 0.0 0.0",
          "4.0 5.0 0.0 0.0 0.0 0.0",
          "5.0 6.0 0.0 0.0 0.0 0.0",
          "6.0 8.0 0.0 0.0 0.0 0.0",
        ]

        # Formation clamp / deadzone / reset
        formation_clamp:
          enable: true
          r_min: 0.18
          r_max: 0.40
          omega_deadzone: 0.01
          omega_max: 4.0
        formation_reset_after_temp_lost: 3
        # SINGLE 模式：无测量超时阈值（秒）
        single_lost_time_thres: 1.5

    # ─────────────────── 基地 ──────────────────────
    base:
      max_base_armor_distance: 1.0
      yaw_offset:    0.0
      pitch_offset:  0.0