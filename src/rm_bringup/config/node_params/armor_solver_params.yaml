/**:
  ros__parameters:

    # ── 调试开关 ──────────────────────────────────────────────────────────────
    debug: true           # rviz 可视化 marker 总开关
    debug_tracker: false
    debug_ekf: false
    debug_solver: false
    debug_filter: false
    debug_outpost: true

    target_frame: gimbal_odom
    max_armor_distance: 4.5

    # ── 地面兵种 EKF（10-D）────────────────────────────────────────────────────
    # 状态：[xc, vx, yc, vy, zc, vz, yaw, v_yaw, r, d_zc]
    ekf:
      # 过程噪声
      sigma2_q_x:     0.1
      sigma2_q_y:     0.1
      sigma2_q_z:     0.1
      sigma2_q_yaw:   1.0
      sigma2_q_r:     98.0
      sigma2_q_d_zc:  800.0

      # 测量噪声
      r_x:    0.0005
      r_y:    0.0005
      r_z:    0.0005
      r_yaw:  0.0060

      # 状态钳位（防发散）
      state_clamp:
        enable:      true
        radius_min:  0.18
        radius_max:  0.35
        d_zc_min:   -0.35
        d_zc_max:    0.35
        v_yaw_min:  -20.0
        v_yaw_max:   20.0

    # ── 速度限幅（Velocity Clamp）─────────────────────────────────────────────
    # tracker 从 LOST 重新识别后，前 frames 帧内对 EKF update() 输出的速度分量做
    # 硬限幅，防止初始化瞬间坐标系切换抖动产生异常速度冲量导致云台抽风。
    vel_clamp:
      frames:      10       # 限幅持续帧数
      linear_max:  0.001    # 线速度上限 (m/s)
      yaw_max:     0.001    # 角速度上限 (rad/s)，仅截断异常冲量

    # ── 地面兵种 Tracker ───────────────────────────────────────────────────────
    tracker:
      max_match_distance:  3.5
      max_match_yaw_diff:  0.7
      tracking_thres:      2
      lost_time_thres:     1.3

    # ── Solver ────────────────────────────────────────────────────────────────
    solver:
      prediction_delay:   0.0
      controller_delay:  -0.002
      min_switching_v_yaw:  1.8
      max_tracking_v_yaw:   5.8   # 转速(rad/s)超过此值时切换瞄准中心模式
      shooting_range_height: 0.755
      shooting_range_width:  0.175
      side_angle:  16.7           # 侧装甲相对中心角度（度）
      bullet_speed:  21.1
      compensator_type: "ideal"
      gravity:     9.82
      resistance:  0.092
      iteration_times: 20         # 弹道补偿迭代次数

      # 装甲板选择：非对称 coming/leaving 角度（高速旋转时生效）
      coming_angle:   55.0        # 向迎面方向多看（度）
      leaving_angle:  20.0        # 向转走方向少看（度）

      # 开火容差（基于装甲板投影宽度自适应计算）
      fire_margin:         0.8    # 投影宽度缩放因子（<1 保守，>1 宽松）
      min_fire_tolerance:  1.5    # 容差下界（度）
      max_fire_tolerance:  4.0    # 容差上界（度）

      # 瞄准偏移（补偿枪管机械安装偏差，无需修改 tf/urdf）
      yaw_offset:    0.0          # 正值向左（度）
      pitch_offset:  0.0          # 正值向上（度）

      # center_mode：直接瞄准机器人整车中心（旋转陀螺专用）
      center_mode:  false
      center_dis:   6.20          # 距离上限 (m)
      center_yaw:   0.335         # 云台 yaw 与目标 yaw 误差上限 (rad)

      # 分段弹道俯仰/偏航补偿：["距离下限 距离上限 高度下限 高度上限 pitch(deg) yaw(deg)"]
      angle_offset: [
        "1.0 2.0 -10000.0 1000.0 2.5 0.0",
        "2.0 3.0 -10000.0 1000.0 3.0 0.1",
        "3.0 4.0 -10000.0 1000.0 3.5 0.2",
        "4.0 5.0 -10000.0 1000.0 4.0 0.4",
        "5.0 6.0 -10000.0 1000.0 4.5 0.5",
        "6.0 8.0 -10000.0 1000.0 5.0 0.65",
      ]

    # ── 前哨站 outpost（由 outpost_solver 集中实现）───────────────────────────
    #
    # 模型：6-D EKF，状态 = [xc, yc, zc, yaw, v_yaw, r]
    #   运动：CONSTANT_ROTATION（中心固定，yaw 匀速旋转，无线速度）
    #   zc  ：三块板 z 高度均值，EKF 初始化时计算，之后作为常量
    #
    # 跟踪策略（三板积累）：
    #   DETECTING：逐块收集 yaw 差 > 40° 的板（最多 3 块）
    #   第四次出现（第一块板循环回来）时初始化 EKF → TRACKING
    #   积累期间 tracking = false，不开火
    # ────────────────────────────────────────────────────────────────────────
    outpost:
      id: "outpost"                  # 与检测器 Armor.number 一致
      radius_m: 0.275                # 旋转半径初值 (m) → EKF r 初始值，在线收敛
      plate_pitch_rad: -0.2617993878 # 装甲板 pitch（向下 15°），仅影响 RViz 显示

      # DETECTING 三板积累判定（可调）
      detect:
        same_plate_yaw_thresh_rad: 0.70     # yaw 小于该值视为同一块板
        require_gap_for_new_plate: true     # 新板必须经历空帧间隔（armors=0）
        min_gap_frames: 1                   # 空帧最少连续帧数
        new_plate_min_yaw_jump_rad: 1.20    # 类似 ArmorJump 的最小 yaw 跳变阈值
        force_next_on_gap: true             # 1->0->1 时强制视为下一块板
        force_next_min_yaw_jump_rad: 0.15   # 强制切板的最小 yaw 跳变保护阈值(rad)
        force_next_min_z_diff_m: 0.03       # 强制切板时，要求与已缓存板的最小高度差(m)
        require_return_to_first_plate: true # 三板缓存后，必须等“第四块=第一块”才进TRACKING
        return_to_first_yaw_thresh_rad: 0.70 # 判断“第四块是否回到第一块”的yaw阈值
        rebuild_on_invalid_height: true     # 若初始化后高度差无效，立即退出并重建
        min_valid_dza_m: 0.02               # 判定“高度差无效”的最小 |d_za| 阈值

      # 瞄准模式：0 = SINGLE_PLATE（单板直瞄），1 = FUSION（EKF 三板跟踪，推荐）
      mode: 1

      # 单板开火约束（SINGLE_PLATE 模式）：|yaw_diff| > 此值时关闭 fire_advice
      fire_yaw_max_deg: 8.0          # 单位：度

      # 前哨站 EKF（6-D，与地面兵种完全独立）
      ekf:
        # 过程噪声（对应状态 [xc, yc, zc, yaw, v_yaw, r]）
        sigma2_q_x:    0.01    # xc 随机游走（前哨站不移动，极小）
        sigma2_q_y:    0.01    # yc 随机游走
        sigma2_q_z:    0.01    # zc 随机游走（均值高度，近似固定）
        sigma2_q_yaw:  1.0     # yaw/v_yaw CWNA 噪声
        sigma2_q_r:    50.0    # r 随机游走（允许在线收敛）

        # 测量噪声
        r_x:    0.0005
        r_y:    0.0005
        r_z:    0.0005    # 适当增大：吸收三板真实 z 高度差异（模型用均值 zc）
        r_yaw:  0.0060

        # 状态钳位（只约束 v_yaw 和 r，防止发散）
        state_clamp:
          enable:      true
          v_yaw_min:  -2.7
          v_yaw_max:   2.7
          radius_min:  0.25
          radius_max:  0.30

      # 前哨专用 Tracker 匹配门限（TRACKING/TEMP_LOST 阶段使用）
      tracker:
        max_match_distance:  0.40    # slot 位置匹配门限 (m)
        max_match_yaw_diff:  1.8     # slot yaw 匹配门限 (rad)
        tracking_thres:      1       # 对前哨站无实际意义，保留接口一致性
        lost_time_thres:     1.7     # TEMP_LOST 超时 & 积累阶段无板超时 (s)
